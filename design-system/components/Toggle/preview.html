<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toggle — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&display=swap" rel="stylesheet"><style></style></head>
<body>
<div class="fv-stage-col" id="s" style="gap:0"></div>
<script>
var F = window.Favolist, $ = function (id) { return document.getElementById(id); };

$('s').appendChild(F.Toggle({label:'Public profile', help:'Anyone with the link can see your lists.', checked:true}));
$('s').appendChild(F.Toggle({label:'Show follower counts'}));
$('s').appendChild(F.Toggle({label:'Allow comments', help:'Coming in a later version.', disabled:true}));

</script>
</body>
</html>
