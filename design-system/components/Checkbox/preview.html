<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&display=swap" rel="stylesheet"><style></style></head>
<body>
<div class="fv-stage-col" id="s" style="gap:0"></div>
<script>
var F = window.Favolist, $ = function (id) { return document.getElementById(id); };

$('s').appendChild(F.Checkbox({label:'Show this list on my profile', checked:true}));
$('s').appendChild(F.Checkbox({label:'Email me when someone follows me', help:'At most once a day.'}));
$('s').appendChild(F.Checkbox({label:'Agree to the terms', disabled:true}));

</script>
</body>
</html>
