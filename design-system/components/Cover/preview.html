<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Favolist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .ink { fill:var(--ink); }
  .pink { fill:var(--accent-vivid); }
  .tint { fill:var(--accent-soft); }
  .hair { fill:var(--line); }
  .sq { rx:var(--radius-none); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.92; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; font-weight:500; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink 136×136 ×2 · accent-vivid 136×136 · accent-soft 136×136 · line 136×136, bleeding off the right and bottom edges — ≈38% of 960×288
  arrangement a flush modular grid, 3 × 2 squares with space-2 gutters, the way list covers and product images tile the feed
  pattern     tiles cut smaller, from "Lists of lists: the mark is four squares, one of them subdivided" — one cell split into four space-16 squares, the bottom pair pink, exactly as the mark does
  scales      sides 136 = 17 × space-2; gutters space-2; small squares space-16; every corner radius-none
-->
<rect class="ink sq"  x="56"  y="8"   width="136" height="136"/>
<rect class="tint sq" x="200" y="8"   width="136" height="136"/>
<rect class="ink sq"  x="344" y="8"   width="136" height="136"/>
<rect class="pink sq" x="56"  y="152" width="136" height="136"/>
<rect class="ink sq"  x="200" y="152" width="64"  height="64"/>
<rect class="ink sq"  x="272" y="152" width="64"  height="64"/>
<rect class="pink sq" x="200" y="224" width="64"  height="64"/>
<rect class="pink sq" x="272" y="224" width="64"  height="64"/>
<rect class="hair sq" x="344" y="152" width="136" height="136"/>
</svg>
</div>
<div class="words">
<h1 class="name">Favolist</h1>
<p class="tag">The products a creator actually uses, reviewed in their own words.</p>
</div>
</div>
</body>
</html>
