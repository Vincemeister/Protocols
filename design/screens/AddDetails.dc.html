<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a product — details</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/favolist/tokens.css">
<link rel="stylesheet" href="ds/favolist/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: var(--accent); } a:hover { color: var(--accent-hover); }
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">

  <header class="fv-topbar" style="position: static; flex: none;">
    <a class="fv-icon-btn" href="AddSource.dc.html" aria-label="Back" style="width: 48px; height: 48px; justify-content: center; color: var(--ink);">
      <svg class="fv-icon fv-icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 class="fv-topbar-title">Check the details</h1>
    <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); text-align: center;">2 of 3</span>
  </header>

  <main style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 24px 16px 16px;">

    <div class="fv-alert fv-alert-success" role="status">
      <svg class="fv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
      <div class="fv-alert-text">Fetched from peakdesign.com. Fix anything that's off.</div>
    </div>

    <div style="display: flex; gap: 16px; align-items: flex-start;">
      <button class="fv-uploader has-image" type="button" aria-label="Replace image" style="width: 120px; flex: none;">
        <div class="fv-uploader-fill" style="background: var(--surface-sunken); display: flex; align-items: center; justify-content: center; color: var(--ink-faint);">
          <svg class="fv-icon fv-icon-lg" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
      </button>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
        <p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted);">We found 4 pictures. Square ones look best.</p>
        <div style="display: flex; gap: 8px;">
          <button class="fv-btn fv-btn-tertiary fv-btn-sm" type="button">Choose</button>
          <button class="fv-btn fv-btn-link fv-btn-sm" type="button">Upload mine</button>
        </div>
      </div>
    </div>

    <div class="fv-field">
      <label class="fv-label" for="name">Product name</label>
      <input class="fv-input" id="name" type="text" value="Everyday Sling 6L" maxlength="80">
    </div>

    <div class="fv-field">
      <label class="fv-label" for="brand">Brand</label>
      <input class="fv-input" id="brand" type="text" value="Peak Design">
    </div>

    <div class="fv-field">
      <label class="fv-label" for="list">Add to list</label>
      <div class="fv-select-wrap">
        <select class="fv-select" id="list">
          <option>Camera bag essentials</option>
          <option>Desk setup</option>
          <option>Bali travel kit</option>
          <option>New list…</option>
        </select>
        <svg class="fv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <div class="fv-field">
      <label class="fv-label" for="code">Referral code <span class="fv-optional">Optional</span></label>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <input class="fv-input" id="code" type="text" placeholder="VINCE10" style="font-family: var(--font-mono); letter-spacing: 0.02em;">
        <input class="fv-input" type="text" placeholder="10% off" aria-label="What the code gives">
      </div>
      <div class="fv-help"><span>Shown as "10% off with VINCE10" under your review.</span></div>
    </div>

    <div style="margin-top: auto;">
      <a class="fv-btn fv-btn-primary fv-btn-lg fv-btn-block" href="AddReview.dc.html">Next: your review</a>
    </div>

  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
