<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a product — paste a link</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/favolist/tokens.css">
<link rel="stylesheet" href="ds/favolist/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: var(--accent); } a:hover { color: var(--accent-hover); }
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">

  <header class="fv-topbar" style="position: static; flex: none;">
    <a class="fv-icon-btn" href="Main.dc.html" aria-label="Close" style="width: 48px; height: 48px; justify-content: center; color: var(--ink);">
      <svg class="fv-icon fv-icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </a>
    <h1 class="fv-topbar-title">Add a product</h1>
    <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); text-align: center;">1 of 3</span>
  </header>

  <main style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 24px; padding: 32px 16px 16px;">

    <div>
      <h2 style="margin: 0 0 8px; font-size: 24px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em;">Paste a link</h2>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted);">We'll fetch the name, picture and brand. Amazon, Shopify stores, app stores and most websites work.</p>
    </div>

    <div class="fv-field">
      <label class="fv-label" for="url">Product link</label>
      <input class="fv-input" id="url" type="url" placeholder="https://" autocomplete="off">
      <div class="fv-help"><span>Tip: on your phone, share the page to Favolist and skip this step.</span></div>
    </div>

    <button class="fv-btn fv-btn-primary fv-btn-lg fv-btn-block" type="button" disabled>Fetch details</button>

    <div style="display: flex; align-items: center; gap: 12px; color: var(--ink-faint); font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.06em;">
      <span style="flex: 1; height: 1px; background: var(--line);"></span>OR<span style="flex: 1; height: 1px; background: var(--line);"></span>
    </div>

    <a class="fv-btn fv-btn-tertiary fv-btn-lg fv-btn-block" href="AddDetails.dc.html">Add it manually</a>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
      <h3 class="fv-overline" style="margin: 0;">Recently added by you</h3>
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line);">
        <div class="fv-referral-thumb" style="width: 40px; height: 40px;"><svg class="fv-icon fv-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></div>
        <div style="flex: 1; min-width: 0;"><div style="font-size: 14px; line-height: 20px; font-weight: 600;">Everyday Sling 6L</div><div style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted);">Camera bag essentials · yesterday</div></div>
      </div>
    </div>

  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
