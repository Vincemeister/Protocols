<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a product — fetching</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/favolist/tokens.css">
<link rel="stylesheet" href="ds/favolist/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; }
a { color: var(--accent); } a:hover { color: var(--accent-hover); }
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans);">

  <header class="fv-topbar" style="position: static; flex: none;">
    <a class="fv-icon-btn" href="AddSource.dc.html" aria-label="Back" style="width: 48px; height: 48px; justify-content: center; color: var(--ink);">
      <svg class="fv-icon fv-icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 class="fv-topbar-title">Add a product</h1>
    <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); text-align: center;">1 of 3</span>
  </header>

  <main style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 24px; padding: 32px 16px 16px;">

    <div class="fv-field">
      <label class="fv-label" for="url">Product link</label>
      <input class="fv-input" id="url" type="url" value="https://www.peakdesign.com/products/everyday-sling" disabled>
    </div>

    <div class="fv-loadmore" style="justify-content: flex-start; height: auto; padding: 0;">
      <span class="fv-spinner"></span>Reading peakdesign.com
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--line);" aria-hidden="true">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div class="fv-skeleton fv-skeleton-text" style="width: 120px;"></div>
        <div class="fv-skeleton" style="width: 88px; height: 32px;"></div>
      </div>
      <div class="fv-skeleton" style="width: 100%; aspect-ratio: 4 / 3;"></div>
      <div class="fv-skeleton fv-skeleton-text" style="width: 70%; height: 18px;"></div>
      <div class="fv-skeleton fv-skeleton-text" style="width: 45%;"></div>
    </div>

    <p style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted);">This usually takes a few seconds. You can fix anything we get wrong on the next step.</p>

    <div style="margin-top: auto;">
      <a class="fv-btn fv-btn-tertiary fv-btn-lg fv-btn-block" href="AddDetails.dc.html">Skip and add it manually</a>
    </div>

  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
